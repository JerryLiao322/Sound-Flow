name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# 同一分支同时只跑一组；新推送排在后面，不打断正在打包的那次
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  web:
    name: 前端检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  audio-diagnose:
    name: 音频后端 · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 2022 (build 20348) 和 2025 (build 26100) 分别走按应用路由接口的两个版本
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: audio
      - name: 单元测试
        run: cargo test -p soundflow-audio
      # 运行器默认没开音频服务、也没有声卡：开服务，再装一块虚拟声卡（Scream），
      # 让诊断能对真实设备做「写入 → 读回」。装不上也不影响后面的检查。
      - name: 准备音频服务和虚拟声卡
        continue-on-error: true
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          Set-Service -Name Audiosrv -StartupType Automatic
          Start-Service -Name Audiosrv
          Invoke-WebRequest https://github.com/duncanthrax/scream/releases/download/4.0/Scream4.0.zip -OutFile scream.zip
          Expand-Archive scream.zip -DestinationPath scream -Force
          $sys = Get-ChildItem -Recurse scream -Filter Scream.sys | Where-Object FullName -match 'x64' | Select-Object -First 1
          $inf = Get-ChildItem $sys.DirectoryName -Filter *.inf | Select-Object -First 1
          $cert = (Get-AuthenticodeSignature $sys.FullName).SignerCertificate
          $store = [System.Security.Cryptography.X509Certificates.X509Store]::new('TrustedPublisher', 'LocalMachine')
          $store.Open('ReadWrite'); $store.Add($cert); $store.Close()
          $devcon = Get-ChildItem -Recurse scream -Filter 'devcon*.exe' | Where-Object Name -match 'x64' | Select-Object -First 1
          & $devcon.FullName install $inf.FullName '*Scream'
          Start-Sleep -Seconds 5
          Get-CimInstance Win32_SoundDevice | Format-Table Name, Status -AutoSize | Out-String | Write-Host
      - name: 在真实 Windows 上跑一遍 Core Audio 调用
        shell: pwsh
        run: |
          $out = cargo run -q -p soundflow-audio --example diagnose
          $out | ForEach-Object { Write-Host $_ }
          # 读回的值和写入的不一样，基本就是方法表位置算错了；崩溃则 cargo run 本身会失败
          if ($out -match 'ROUND_TRIP_MISMATCH') {
            Write-Error '按应用路由接口读写不一致，方法表位置可能不对'
            exit 1
          }

  windows-installer:
    name: Windows 安装包
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: 打包
        run: npm run app:build
      - uses: actions/upload-artifact@v4
        with:
          name: sound-flow-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
