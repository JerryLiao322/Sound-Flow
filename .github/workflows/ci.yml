name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# 同一分支同时只跑一组；新推送排在后面，不打断正在打包的那次
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  web:
    name: 前端检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  audio-diagnose:
    name: 音频后端 · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 2022 (build 20348) 和 2025 (build 26100) 分别走按应用路由接口的两个版本
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: audio
      - name: 单元测试
        run: cargo test -p soundflow-audio
      # 让诊断能对真实设备做「写入 → 读回」；装不上也不影响后面的检查
      - name: 准备音频服务和虚拟声卡
        timeout-minutes: 5
        continue-on-error: true
        shell: pwsh
        run: ../.github/scripts/setup-audio.ps1
      - name: 在真实 Windows 上跑一遍 Core Audio 调用
        shell: pwsh
        run: |
          $out = cargo run -q -p soundflow-audio --example diagnose
          $out | ForEach-Object { Write-Host $_ }
          # 读回的值和写入的不一样，基本就是方法表位置算错了；崩溃则 cargo run 本身会失败
          if ($out -match 'ROUND_TRIP_MISMATCH') {
            Write-Error '按应用路由接口读写不一致，方法表位置可能不对'
            exit 1
          }

  windows-installer:
    name: Windows 安装包
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: 打包
        run: npm run app:build
      - uses: actions/upload-artifact@v4
        with:
          name: sound-flow-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  install-smoke:
    name: 安装冒烟测试
    needs: windows-installer
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sound-flow-windows-installer
          path: installer
      - name: 准备音频服务和虚拟声卡
        timeout-minutes: 5
        continue-on-error: true
        shell: pwsh
        run: ./.github/scripts/setup-audio.ps1
      - name: 静默安装、启动、检查窗口、卸载
        timeout-minutes: 8
        shell: pwsh
        run: ./.github/scripts/smoke-test.ps1 -InstallerDir installer
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test-screenshot
          path: ${{ runner.temp }}/sound-flow.png
          if-no-files-found: ignore
